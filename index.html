<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGG - Registro de Usuario</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Switch Control de Tema (RF-02) -->
  <div class="top-bar">
    <div class="theme-switch-container">
      <span>Modo</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <main class="auth-container">
    <div class="auth-header">
      <h1>Crear Cuenta</h1>
      <p>SGG - Registro de Nuevo Usuario</p>
    </div>

    <div id="reg-alert" class="alert"></div>

    <!-- Formulario de Registro (RF-03) -->
    <form id="registro-form" novalidate>
      <div class="form-group">
        <label for="reg-nombre">Nombre/s</label>
        <input type="text" id="reg-nombre" class="form-control" placeholder="Juan Carlos" required>
      </div>

      <div class="form-group">
        <label for="reg-apellido">Apellido/s</label>
        <input type="text" id="reg-apellido" class="form-control" placeholder="Pérez" required>
      </div>

      <div class="form-group">
        <label for="reg-fecha-nac">Fecha de Nacimiento</label>
        <input type="date" id="reg-fecha-nac" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="reg-email">Correo Electrónico Corporativo</label>
        <input type="email" id="reg-email" class="form-control" placeholder="usuario@empresa.com" required>
      </div>

      <div class="form-group">
        <label for="reg-password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
          <button type="button" id="toggle-reg-password" class="toggle-password-btn" title="Mostrar/Ocultar">👁️</button>
        </div>

        <!-- Feedback UX en Tiempo Real (5 Requisitos) -->
        <div class="password-requirements">
          <p>Requisitos de Seguridad:</p>
          <ul>
            <li id="req-length"><span class="status-icon">✕</span> Mínimo 8 caracteres</li>
            <li id="req-upper"><span class="status-icon">✕</span> Al menos 1 Mayúscula</li>
            <li id="req-lower"><span class="status-icon">✕</span> Al menos 1 Minúscula</li>
            <li id="req-number"><span class="status-icon">✕</span> Al menos 1 Número (0-9)</li>
            <li id="req-special"><span class="status-icon">✕</span> Al menos 1 Carácter especial (!@#$...)</li>
          </ul>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-confirm-password">Repetir Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required>
          <button type="button" id="toggle-reg-confirm" class="toggle-password-btn" title="Mostrar/Ocultar">👁️</button>
        </div>
      </div>

      <button type="submit" id="reg-submit-btn" class="btn-primary" disabled>Registrarse</button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tenés una cuenta? <a href="index.html">Iniciar Sesión</a></p>
    </div>
  </main>

  <!-- Módulos JavaScript Externos -->
  <script src="js/theme.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
