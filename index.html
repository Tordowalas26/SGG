<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Mejora SEO -->
  <meta name="description" content="Sistema de Gestión de Gastos (SGG) - Inicia sesión para controlar tus finanzas personales.">
  
  <title>SGG - Inicio de Sesión</title>

  <!-- Precarga de Estilos -->
  <link rel="preload" href="css/style.css" as="style">
  <link rel="stylesheet" href="css/style.css">

  <!-- Scripts Asíncronos No Bloqueantes (Mejora Performance) -->
  <script src="js/theme.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/validators.js" defer></script>
  <script src="js/ui-helpers.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body>

  <!-- Switch Control de Tema -->
  <div class="top-bar">
    <div class="theme-switch-container">
      <span>Modo</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" aria-label="Cambiar modo oscuro/claro">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <main class="auth-container">
    <div class="auth-header">
      <h1>Sistema de Gestión de Gastos</h1>
      <p>Inicie sesión para acceder a su cuenta</p>
    </div>

    <div id="login-alert" class="alert" role="alert"></div>

    <!-- Formulario de Login -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Correo Electrónico</label>
        <input type="email" id="login-email" class="form-control" placeholder="ejemplo@dominio.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" id="toggle-login-password" class="toggle-password-btn" title="Mostrar u ocultar contraseña" aria-label="Mostrar u ocultar contraseña">👁️</button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="btn-primary">Iniciar Sesión</button>
    </form>

    <div class="auth-footer">
      <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
      <p style="margin-top: 8px;">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
  </main>

</body>
</html>
